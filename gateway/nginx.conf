events {}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  # No nginx version in the Server header or error pages.
  server_tokens off;

  # The coach's own files and API compress well (steps.json: 587 KB, 99 KB gzipped; coach.js:
  # 189 KB, 53 KB), which matters on a slow connection. Only the coach's locations turn gzip on;
  # RStudio's responses pass through as RStudio sends them. gzip_proxied any: on iximiuz, requests
  # arrive through the platform's proxy.
  gzip_types application/javascript application/json text/css;
  gzip_proxied any;
  gzip_vary on;
  gzip_min_length 1024;

  map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 8788;
    server_name _;
    client_max_body_size 50m;

    # no-cache, not no-store: the browser keeps a copy and asks each time whether it changed
    # (ETag), so a reload costs a short 304 instead of the whole file.
    location /coach/ {
      gzip on;
      alias /usr/share/nginx/html/coach/;
      add_header Cache-Control "no-cache" always;
      add_header X-Content-Type-Options "nosniff" always;
    }

    # Stand-ins for the run service: per-run files written by tools/provision.py.
    location = /coach/api/session {
      gzip on;
      default_type application/json;
      alias /usr/share/nginx/html/coach-run/session.json;
      add_header Cache-Control "no-cache" always;
      add_header X-Content-Type-Options "nosniff" always;
    }

    location = /coach/api/steps {
      gzip on;
      default_type application/json;
      alias /usr/share/nginx/html/coach-run/steps.json;
      add_header Cache-Control "no-cache" always;
      add_header X-Content-Type-Options "nosniff" always;
    }

    # What R recorded about the learner's work (runtime/evidence.R): only for a browser signed in
    # to RStudio. RStudio answers / with 200 when signed in and 302 to its sign-in page otherwise;
    # auth_request treats that 302 as an error (500), which becomes 401 here. With sign-in off
    # (DISABLE_AUTH=true), RStudio signs in any browser that asks, so this only keeps out clients
    # that never opened RStudio; whatever guards the gateway (iximiuz's private tab) guards this too.
    # Compressed, but still no-store: nginx's ETag changes only with the file's size and its
    # modification time in whole seconds, and R can rewrite it twice in a second at the same size.
    location = /coach/api/evidence {
      gzip on;
      auth_request /coach/__signed_in;
      error_page 500 = @not_signed_in;
      alias /usr/share/nginx/html/coach-evidence/evidence.json;
      default_type application/json;
      add_header Cache-Control "no-store" always;
      add_header X-Content-Type-Options "nosniff" always;
    }

    location = /coach/__signed_in {
      internal;
      proxy_pass http://rstudio:8787/;
      proxy_http_version 1.1;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location @not_signed_in {
      default_type application/json;
      add_header Cache-Control "no-store" always;
      add_header X-Content-Type-Options "nosniff" always;
      return 401 '{"error":"sign in to RStudio first"}';
    }

    location = /coach/api/check {
      default_type application/json;
      add_header Cache-Control "no-store" always;
      add_header X-Content-Type-Options "nosniff" always;
      return 200 '{"status":"stub","message":"Grading is not built yet. Save analysis.R first."}';
    }

    # Only the IDE host page gets the coach. Help, Viewer and other RStudio
    # HTML (often shown in iframes) pass through untouched.
    location = / {
      include /etc/nginx/rstudio-proxy.conf;
      proxy_set_header Accept-Encoding "";
      # Load before GWT's loader so the coach's capture-phase key shield is registered first.
      sub_filter_once on;
      sub_filter '<head>' '<head><script src="/coach/coach.js"></script>';
      # RStudio not answering yet (the gateway can be up a second before it): nginx's own 502 page
      # would stay until the learner reloads, so show a page that reloads itself instead. Only for
      # this page; RStudio's own requests still get the 502, which its client handles.
      error_page 502 504 =503 /coach/__starting;
    }

    location = /coach/__starting {
      internal;
      alias /usr/share/nginx/html/gateway/starting.html;
      default_type text/html;
      add_header Cache-Control "no-store" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Retry-After "2" always;
    }

    location / {
      include /etc/nginx/rstudio-proxy.conf;
    }
  }
}
