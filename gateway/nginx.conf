events {}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;

  map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 8788;
    server_name _;
    client_max_body_size 50m;

    location /coach/ {
      alias /usr/share/nginx/html/coach/;
      add_header Cache-Control "no-store" always;
    }

    # Stand-ins for the run service: per-run files written by tools/provision.py.
    location = /coach/api/session {
      alias /usr/share/nginx/html/coach-run/session.json;
      add_header Cache-Control "no-store" always;
    }

    location = /coach/api/steps {
      alias /usr/share/nginx/html/coach-run/steps.json;
      add_header Cache-Control "no-store" always;
    }

    # What R recorded about the learner's work (runtime/evidence.R): only for a browser signed in
    # to RStudio. RStudio answers / with 200 when signed in and 302 to its sign-in page otherwise;
    # auth_request treats that 302 as an error (500), which becomes 401 here.
    location = /coach/api/evidence {
      auth_request /coach/__signed_in;
      error_page 500 = @not_signed_in;
      alias /usr/share/nginx/html/coach-evidence/evidence.json;
      default_type application/json;
      add_header Cache-Control "no-store" always;
    }

    location = /coach/__signed_in {
      internal;
      proxy_pass http://rstudio:8787/;
      proxy_http_version 1.1;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location @not_signed_in {
      default_type application/json;
      add_header Cache-Control "no-store" always;
      return 401 '{"error":"sign in to RStudio first"}';
    }

    location = /coach/api/check {
      default_type application/json;
      add_header Cache-Control "no-store" always;
      return 200 '{"status":"stub","message":"Grading is not built yet. Save analysis.R first."}';
    }

    # Only the IDE host page gets the coach. Help, Viewer and other RStudio
    # HTML (often shown in iframes) pass through untouched.
    location = / {
      include /etc/nginx/rstudio-proxy.conf;
      proxy_set_header Accept-Encoding "";
      # Load before GWT's loader so the coach's capture-phase key shield is registered first.
      sub_filter_once on;
      sub_filter '<head>' '<head><script src="/coach/coach.js"></script>';
    }

    location / {
      include /etc/nginx/rstudio-proxy.conf;
    }
  }
}
