kind: playground
name: rstudio-guide-16afe14e
base: docker
title: RStudio coach
description: RStudio Server with an in-IDE coach and two lessons (graphical and statistical tools in base R), each in Demonstration, Guided or Solo mode.
categories:
    - linux
markdown: |-
    RStudio Server with a coach docked in its sidebar.

    1. The **Terminal** tab shows the RStudio username and password.
    2. Open the **RStudio** tab and sign in.
    3. In the **Coach** pane on the right, choose a lesson, then **Demonstration** (watch), **Guided** (do it with hints) or **Solo** (do it, then check).
playground:
    networks:
        - name: local
          subnet: 172.16.0.0/24
    machines:
        - name: docker-01
          users:
            - name: root
            - name: laborant
              default: true
          drives:
            - source: oci://ghcr.io/lpmi-13/rstudio-guide-rootfs:v3
              mount: /
              size: 20GiB
          network:
            interfaces:
                - network: local
          resources:
            cpuCount: 2
            ramSize: 4GiB
    tabs:
        - id: terminal
          kind: terminal
          name: Terminal
          machine: docker-01
        - id: rstudio
          kind: http-port
          name: RStudio
          machine: docker-01
          number: 8788
          access: private
    initTasks:
        init_start_rstudio:
            name: init_start_rstudio
            machine: docker-01
            init: true
            user: laborant
            timeout_seconds: 600
            run: |
                set -eu
                /home/laborant/rstudio-guide/iximiuz/start-lab.sh
    initConditions: {}
    accessControl:
        canList:
            - anyone
        canRead:
            - anyone
        canStart:
            - anyone
