name: rstudio-guide

services:
  rstudio:
    image: rstudio-guide-runtime:local
    build:
      context: .
      dockerfile: runtime/Dockerfile
    environment:
      # Always set, even with sign-in off, so the account never keeps Rocker's default password.
      PASSWORD: ${RSTUDIO_PASSWORD:?start with ./run.sh up}
      # "true" opens RStudio with no sign-in (Rocker sets auth-none=1). Only for a gateway that something
      # else already guards, such as an iximiuz tab with private access; run.sh explains.
      DISABLE_AUTH: ${DISABLE_AUTH:-false}
      LAB_PROJECT: /home/rstudio/${LAB_SCENARIO:?start with ./run.sh up}/${LAB_SCENARIO}.Rproj
      # Rocker re-creates the rstudio user with these IDs when they differ from 1000.
      USERID: ${HOST_UID:-1000}
      GROUPID: ${HOST_GID:-1000}
      # Empty unless a platform needs to show RStudio in an iframe.
      RSTUDIO_FRAME_ORIGIN: ${FRAME_ORIGIN:-}
      RSTUDIO_SAME_SITE: ${SAME_SITE:-}
    volumes:
      - ./${LAB_RUN_DIR:-run}/project:/home/rstudio/${LAB_SCENARIO}
      # Written by runtime/evidence.R in each R session; served to the coach by the gateway.
      - ./${LAB_RUN_DIR:-run}/evidence:/home/rstudio/.lab
    ports:
      # Direct access for a no-gateway baseline. Loopback only.
      - "127.0.0.1:${RSTUDIO_PORT:-18787}:8787"

  gateway:
    # nginx's stable branch (even minor version) on a supported Alpine. Odd minors are mainline
    # and stop getting fixes once the next one ships.
    image: nginx:1.30.7-alpine
    depends_on: [rstudio]
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./gateway/rstudio-proxy.conf:/etc/nginx/rstudio-proxy.conf:ro
      - ./gateway/starting.html:/usr/share/nginx/html/gateway/starting.html:ro
      - ./coach:/usr/share/nginx/html/coach:ro
      - ./${LAB_RUN_DIR:-run}/public:/usr/share/nginx/html/coach-run:ro
      - ./${LAB_RUN_DIR:-run}/evidence:/usr/share/nginx/html/coach-evidence:ro
    ports:
      - "${GATEWAY_BIND:-127.0.0.1}:${GATEWAY_PORT:-8788}:8788"
